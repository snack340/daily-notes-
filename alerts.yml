name: eurusd-alerts
on:
  schedule:
    - cron: "*/5 * * * *"   # public repo: free. Private repo: change to "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eurusd-alerts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python eurusd_alerts.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TIMEZONE: ${{ vars.TIMEZONE }}
      - name: Save state
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add state.json
          git commit -m "update state" || echo "no changes"
          git push || true
